name: supply-chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vet:
    runs-on: ubuntu-latest
    permissions: # job-scoped, NOT workflow-level — hoisting leaks write perms into the other jobs
      contents: read
      pull-requests: write # vet-action comments findings on the PR
      issues: write # required by vet-action's comment client
    steps:
      # harden-runner: n/a — opted out
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vet CVE gate
        uses: safedep/vet-action@6247cccd1b6683a27946ea3a0d45d3865346918b # v1.1.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Octokit auth — action fails without it
        with:
          policy: .github/vet/policy.yml
  guarddog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: guarddog manifest verify (npm)
        # Blocking gate: fails the job on any finding; text output to the CI log.
        # Scans package.json (declared deps), NOT a lockfile. -r = metadata-only
        # allowlist (skips per-dep source semgrep; vet covers known-malicious).
        run: uvx guarddog npm verify package.json -r typosquatting -r potentially_compromised_email_domain -r unclaimed_maintainer_email_domain -r deceptive_author --exit-non-zero-on-finding
  socket-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # Install the resolved tree THROUGH Socket so every transitive package
      # meets the behavioral feed. min-age forced to 0 so a too-fresh transitive
      # can't fail the job — Socket's malicious verdict is age-independent.
      - run: sfw npm ci
        env:
          npm_config_min_release_age: "0"
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: zizmor workflow audit
        # `|| true`: zizmor exits 14 on findings — without it bash -e aborts
        # before the unpinned-uses filter runs. Guard on valid JSON and fail
        # CLOSED: a gate must not wave a PR through on a scan error.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=$(uvx zizmor --format json --min-severity=medium .github/workflows || true)
          if ! jq -e 'type == "array"' <<<"$OUT" >/dev/null 2>&1; then
            echo "::error::zizmor returned no valid JSON (scan errored) — failing closed"; exit 1
          fi
          HITS=$(jq '[.[] | select(.ident != "unpinned-uses")]' <<<"$OUT")
          N=$(jq 'length' <<<"$HITS")
          if [ "$N" -gt 0 ]; then
            jq -r 'group_by(.ident) | map("\(.[0].ident)×\(length)") | join(", ")' <<<"$HITS"
            echo "::error::zizmor found $N medium+ workflow finding(s)"; exit 1
          fi
