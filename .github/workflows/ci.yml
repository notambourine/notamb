name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fleet:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@be38cfcf9f9a3447ea3915d0231d027ef1992658 # v1.10.0
    with:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      vet: true # small tree, keyless is seconds
      vet-policy: .github/vet/policy.yml # gate on critical advisories only
      actionlint-extra-labels: |
        blacksmith-2vcpu-ubuntu-2404
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 10 # install through Socket, then lint, build, and the test suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      - run: npm run lint
      - run: npm test
