name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fleet:
    permissions:
      contents: read
    uses: notambourine/fleet-actions/.github/workflows/fleet-ci.yml@3b6ab5d2b588283e483fe678df9fe255a44921ca # v1.11.0
    with:
      pnpm-pin: false # npm repo; the pin targets pnpm's packageManager field
      vet: true # small tree, keyless is seconds
      vet-severity: critical
      guarddog: true
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    timeout-minutes: 10 # install through Socket, then lint, build, and the test suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw npm ci
      - run: npm run lint
      - run: npm test
